name: Observatorio UX - CI Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  auditoria-tecnica:
    name: Validacion de Codigo y Contratos Zod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar contratos compartidos (shared-types)
        run: npm run build --workspace=packages/shared-types

      - name: Verificacion de tipos en todo el monorepo
        run: npm run build --workspaces
